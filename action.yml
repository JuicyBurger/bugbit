name: 'vilancer-bugbit'
description: 'Review pull requests using your own Cursor agent'
author: 'vilancer'
branding:
  icon: 'search'
  color: 'green'

inputs:
  cursor-api-key:
    description: 'Cursor API key (pass as a secret)'
    required: true
  model:
    description: 'Cursor model id to use, e.g. composer-2.5'
    required: false
    default: 'composer-2.5'
  review-modes:
    description: >
      Comma-separated list of review modes to run. Each mode maps to a
      Cursor built-in skill (/code-review, /review-security, /simplify).
      Output is read-only: findings posted as inline PR comments.
      Any of: code-review, security-review, simplify
    required: false
    default: 'code-review'
  github-token:
    description: >
      Token used to read PR context and post review comments. The consumer
      workflow must grant permissions: contents: read, pull-requests: write.
    required: true
    default: '${{ github.token }}'
  save-stream-log:
    description: >
      When true, save raw agent stream events as a JSONL artifact for debugging.
      Applies to every workflow trigger (pull_request, workflow_dispatch, etc.)
      when enabled in the consumer job. Artifact name format:
      bugbit-agent-stream-{agentRunId}-gh{githubRunId}-{YYYYMMDD-HHMMSSZ}.
      Requires actions: write on the consumer workflow job.
    required: false
    default: 'false'

runs:
  using: 'node24'
  main: 'dist/index.js'
