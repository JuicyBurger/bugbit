name: 'bugbit'
description: 'Review pull requests using your own Cursor agent'
author: 'vilancer'
branding:
  icon: 'search'
  color: 'green'

inputs:
  cursor-api-key:
    description: 'Cursor API key (pass as a secret)'
    required: true
  model:
    description: 'Cursor model id to use, e.g. composer-2.5'
    required: false
    default: 'composer-2.5'
  review-modes:
    description: >
      Comma-separated list of review modes to run. Each mode maps to a
      Cursor built-in skill (/review, /review-security, /simplify).
      Output is read-only: findings posted as inline PR comments.
      Any of: code-review, security-review, simplify
    required: false
    default: 'code-review'
  github-token:
    description: >
      Token forwarded to the agent's scripts (as GITHUB_TOKEN) so it
      can read PR context and post inline comments itself.
    required: true
    default: '${{ github.token }}'

runs:
  using: 'node24'
  main: 'dist/index.js'
